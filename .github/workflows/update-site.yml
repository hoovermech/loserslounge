name: Refresh Oracle site
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oracle-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site from Sleeper
        run: |
          mkdir public
          cp index.html manifesto.html rumours.html trade_rumours.json styles.css app.js league_data.json public/
          if [ -f CNAME ]; then cp CNAME public/; fi
          python update_from_sleeper.py --data public/league_data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
